version: 2

models:
  - name: int_order_product_metrics
    description: Aggregated product quantity per order.
    columns:
      - name: order_id
        description: Unique identifier of the order.
        data_tests:
          - not_null
          - unique

      - name: qty_product
        description: Total quantity of products in the order.
        data_tests:
          - not_null

  - name: int_customer_order_history
    description: Order-level customer history with the number of prior orders in the previous 12 months.
    columns:
      - name: order_id
        description: Unique identifier of the current order.
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: Unique identifier of the customer.
        data_tests:
          - not_null

      - name: order_date
        description: Date of the current order.
        data_tests:
          - not_null

      - name: previous_orders_12m
        description: Number of previous orders placed by the customer in the prior 12 months.
        data_tests:
          - not_null