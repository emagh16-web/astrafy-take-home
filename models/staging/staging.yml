version: 2

models:
  - name: stg_orders
    description: Cleaned order-level data with one row per order.
    columns:
      - name: order_date
        description: Date when the order was placed.
        data_tests:
          - not_null

      - name: customer_id
        description: Unique identifier of the customer.
        data_tests:
          - not_null

      - name: order_id
        description: Unique identifier of the order.
        data_tests:
          - not_null
          - unique

      - name: net_sales
        description: Total net sales amount of the order.
        data_tests:
          - not_null

  - name: stg_sales
    description: Cleaned product-level sales data with one row per order and product line.
    columns:
      - name: order_date
        description: Date when the order was placed.
        data_tests:
          - not_null

      - name: customer_id
        description: Unique identifier of the customer.
        data_tests:
          - not_null

      - name: order_id
        description: Identifier of the related order.
        data_tests:
          - not_null

      - name: product_id
        description: Identifier of the product sold.
        data_tests:
          - not_null

      - name: net_sales
        description: Net sales amount of the product line.
        data_tests:
          - not_null

      - name: qty
        description: Quantity of the product in the order line.
        data_tests:
          - not_null